[package]
name = "s9s"
version = "0.1.0"
edition = "2024"
description = "A read-only, k9s-style terminal UI for AWS: ECS, CloudWatch Logs, load balancers, autoscaling"
license = "MIT"
readme = "README.md"
keywords = ["aws", "ecs", "tui", "k9s", "cloudwatch"]
categories = ["command-line-utilities"]

[dependencies]
aws-config = { version = "1.12.0", features = ["behavior-version-latest", "credentials-login"] }
aws-sdk-applicationautoscaling = "1.122.0"
aws-sdk-cloudwatch = "1.134.0"
aws-sdk-cloudwatchlogs = "1.156.0"
aws-sdk-ec2 = "1.268.0"
aws-sdk-ecr = "1.132.0"
aws-sdk-ecs = "1.150.0"
aws-sdk-elasticloadbalancingv2 = "1.129.0"
aws-sdk-lambda = "1.151.0"
aws-sdk-rds = "1.154.0"
aws-sdk-sqs = "1.114.0"
aws-sdk-sts = "1.119.0"
aws-smithy-types = "1.8.1"
chrono = "0.4.45"
ratatui = "0.30.2"
regex = "1.13.1"
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
